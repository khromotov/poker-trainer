<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Poker Trainer — 6 of spades and 7 of hearts</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#263650"/><stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf7"/><stop offset="1" stop-color="#eeeade"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#050b15" flood-opacity=".38"/>
    </filter>
    <symbol id="six" viewBox="0 0 80 100">
      <path fill-rule="evenodd" d="M42 8C20 8 10 29 10 53c0 24 11 36 30 36 18 0 30-13 30-31 0-17-12-28-28-28-9 0-16 4-21 10 2-17 9-22 21-22 6 0 12 2 17 6l6-11C59 10 51 8 42 8Zm-2 35c10 0 17 6 17 16s-6 17-17 17c-11 0-18-7-18-18 0-9 7-15 18-15Z"/>
    </symbol>
    <symbol id="seven" viewBox="0 0 80 100"><path d="M9 10h63v12L38 88H22l34-64H9Z"/></symbol>
    <symbol id="spade" viewBox="0 0 100 110">
      <path d="M50 3C42 18 8 36 8 60c0 18 19 30 34 17-1 12-5 20-12 27h40c-7-7-11-15-12-27 15 13 34 1 34-17C92 36 58 18 50 3Z"/>
    </symbol>
    <symbol id="heart" viewBox="0 0 100 100"><path d="M50 91 14 56C-15 27 22-5 46 19l4 5 4-5C78-5 115 27 86 56Z"/></symbol>
  </defs>
  <path fill="url(#background)" d="M0 0h512v512H0z"/>
  <g transform="rotate(-12 183 240)">
    <rect x="88" y="100" width="190" height="280" rx="22" fill="url(#paper)" filter="url(#shadow)"/>
    <rect x="89" y="101" width="188" height="278" rx="21" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2"/>
    <g fill="#152b38">
      <use href="#six" x="105" y="117" width="52" height="65"/>
      <use href="#spade" x="117" y="183" width="27" height="30"/>
      <use href="#spade" x="119" y="249" width="88" height="97"/>
    </g>
  </g>
  <g transform="rotate(10 327 272)">
    <rect x="232" y="132" width="190" height="280" rx="22" fill="url(#paper)" filter="url(#shadow)"/>
    <rect x="233" y="133" width="188" height="278" rx="21" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2"/>
    <g fill="#c6434c">
      <use href="#seven" x="249" y="149" width="52" height="65"/>
      <use href="#heart" x="261" y="216" width="27" height="27"/>
      <use href="#heart" x="282" y="281" width="91" height="91"/>
